name: build
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCNRL_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - run: python tools/audit_source.py
      - run: python tools/audit_assembly.py build/CMakeFiles/cnrl_core.dir/src/kernels.cpp.o
      - run: python tools/audit_transition_assembly.py build/CMakeFiles/cnrl_core.dir/src/transitions.cpp.o
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./scripts/build_windows.ps1
      - shell: pwsh
        run: python tools/audit_source.py
      - shell: pwsh
        run: ./scripts/audit_windows_assembly.ps1
      - shell: pwsh
        run: ./scripts/audit_windows_transitions.ps1
