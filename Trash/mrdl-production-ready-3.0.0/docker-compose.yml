services:
  mrdl:
    build:
      context: .
    image: mrdl:3.0.0
    volumes:
      # A named volume preserves the mrdl user ownership created in the image.
      # Bind-mount the corpus read-only from the host.
      - mrdl-model:/var/lib/mrdl/model
      - ./data/corpus:/data:ro
    command: ["doctor", "--config", "/etc/mrdl/mrdl.ini", "--allow-unprepared"]
    init: true

volumes:
  mrdl-model:
