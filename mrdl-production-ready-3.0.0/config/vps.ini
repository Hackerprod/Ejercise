# MRDL v3.0 — tuned conservatively for a 4 vCPU / 8 GB RAM VPS.

[model]
embedding_dim = 96
relation_dim = 32
max_relation_prototypes = 4
seed = 5571588

[tokenizer]
vocab_size = 20000
heavy_hitter_multiplier = 4
lowercase = false

[engine]
top_k_full = 16
top_k_clean = 16
beam_full = 32
beam_clean = 32
max_rounds = 4
max_ports_per_node = 8
port_capacity = 8
port_similarity_threshold = 0.68
port_pressure_threshold = 2.0
branch_energy_floor = 0.015
clean_margin = 0.30
clean_health_threshold = 0.50
repetition_penalty = 0.35
cycle_penalty = 0.50
saturation_penalty = 0.20
length_log_penalty = 0.08
confidence_epsilon = 0.05
exact_pure_reuse = true
parallel_lanes = true

[memory]
m1_ttl_seconds = 604800
m1_confidence_cap = 0.45
promotion_min_support = 4
promotion_min_contexts = 3
promotion_min_influence = 0.08
promotion_stability_ratio = 0.75
audit_top_m = 8

[training]
mode = B
context_tokens = 16
max_source_capsules = 4
epochs = 1
batch_tokens = 4096
checkpoint_every_tokens = 100000
fast_learning_rate = 0.04
controller_learning_rate = 0.001
relation_weight_decay = 0.0001
negative_samples = 8
auto_audit = true
trusted_source = false

[persistence]
model_dir = ../model
database = ../model/mrdl.db
tokenizer = ../model/tokenizer.mrdltok
embeddings = ../model/embeddings.mrdlemb
sqlite_busy_timeout_ms = 10000
synchronous_full = true

[runtime]
threads = 4
max_generation_tokens = 128
temperature = 0.0
top_p_candidates = 32
