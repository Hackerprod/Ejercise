name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libsqlite3-dev
      - name: Configure
        run: cmake --preset debug-sanitize
      - name: Build
        run: cmake --build --preset debug-sanitize --parallel 2
      - name: Test ASan/UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ./build/debug/mrdl_tests

  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libsqlite3-dev sqlite3
      - name: Configure portable release
        run: >-
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMRDL_NATIVE_ARCH=OFF
          -DMRDL_BUILD_TESTS=ON
          -DMRDL_BUILD_BENCHMARKS=ON
          -DMRDL_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build/ci --parallel 2
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure
      - name: Bench smoke
        run: ./build/ci/mrdl_bench --quick --iterations 1 --suite all --json
      - name: CLI smoke
        run: ./scripts/smoke_test.sh ./build/ci/mrdl
  clang-portability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build libsqlite3-dev
      - name: Configure Clang with warnings as errors
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build/clang -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DMRDL_NATIVE_ARCH=OFF
          -DMRDL_ENABLE_LTO=OFF
          -DMRDL_BUILD_TESTS=ON
          -DMRDL_BUILD_BENCHMARKS=ON
          -DMRDL_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build/clang --parallel 2
      - name: Test
        run: ctest --test-dir build/clang --output-on-failure

