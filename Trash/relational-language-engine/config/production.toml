# Paths are resolved relative to this file.
[storage]
state_dir = "../data/state"
embedding_file = "../data/embeddings.rle"
shards = 32
durability = "data"

[search]
beam_width = 16
candidate_k = 32
max_depth = 4
replay_reopen_limit = 4096
state_decay = 0.65
relation_mix = 0.65
target_mix = 0.35

[scoring]
confidence_weight = 1.40
support_weight = 0.25
relation_weight = 0.90
target_weight = 1.10
context_weight = 0.35
repetition_penalty = 0.30

[audit]
min_exact_cases = 3
max_cases = 8
max_unknown_cases = 2
causal_margin = 0.05
min_pass_fraction = 0.67
allow_empty_clean_bootstrap = true

[training]
batch_tokens = 4096
context_radius = 4
evidence_cases_per_edge = 4
auto_promote_per_batch = 128
min_support_for_promotion = 4
min_confidence_for_promotion = 0.55
m1_ttl_seconds = 604800
max_m1_edges = 2000000
checkpoint_every_batches = 10
reject_unknown_tokens = false

[replay]
max_records = 250000

[runtime]
parallel_lanes = true
worker_threads = 4
queue_capacity = 1024
service_port = 9087
