# Conservative profile for the user's 4-vCPU / 8-GB VPS.
[storage]
state_dir = "../data/state"
embedding_file = "../data/embeddings.rle"
shards = 16
durability = "data"

[search]
beam_width = 8
candidate_k = 16
max_depth = 3
replay_reopen_limit = 2048
state_decay = 0.65
relation_mix = 0.65
target_mix = 0.35

[scoring]
confidence_weight = 1.40
support_weight = 0.25
relation_weight = 0.90
target_weight = 1.10
context_weight = 0.35
repetition_penalty = 0.30

[audit]
min_exact_cases = 3
max_cases = 6
max_unknown_cases = 2
causal_margin = 0.05
min_pass_fraction = 0.67
allow_empty_clean_bootstrap = true

[training]
batch_tokens = 2048
context_radius = 4
evidence_cases_per_edge = 4
auto_promote_per_batch = 32
min_support_for_promotion = 4
min_confidence_for_promotion = 0.55
m1_ttl_seconds = 604800
max_m1_edges = 750000
checkpoint_every_batches = 5
reject_unknown_tokens = false

[replay]
max_records = 75000

[runtime]
parallel_lanes = true
worker_threads = 4
queue_capacity = 256
service_port = 9087
